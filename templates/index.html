<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; }

        .header {
            background: #16213e;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { color: #e94560; font-size: 1.3rem; }
        .provider-select {
            background: #0f3460;
            color: #fff;
            border: 1px solid #e94560;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .clear-btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .clear-btn:hover { background: #c73650; }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user {
            align-self: flex-end;
            background: #e94560;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bot {
            align-self: flex-start;
            background: #16213e;
            color: #eee;
            border: 1px solid #0f3460;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            background: #16213e;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #0f3460;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .input-area input:focus { border-color: #e94560; }
        .send-btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .send-btn:hover { background: #c73650; }
        .send-btn:disabled { background: #555; cursor: not-allowed; }

        .typing {
            align-self: flex-start;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LangChain Chatbot</h1>
        <select class="provider-select" id="provider">
            <option value="ollama">Ollama (Local)</option>
            <option value="llama.cpp">llama.cpp (Local)</option>
            <option value="openai">OpenAI</option>
            <option value="google">Google Gemini</option>
        </select>
        <button class="clear-btn" onclick="clearHistory()">Clear Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! I'm your LangChain chatbot. Ask me anything.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const provider = document.getElementById('provider');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing';
            div.textContent = 'Bot is typing...';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;

            addMessage(msg, true);
            userInput.value = '';
            sendBtn.disabled = true;
            addTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, provider: provider.value })
                });
                const data = await res.json();
                removeTyping();
                addMessage(data.reply, false);
            } catch (err) {
                removeTyping();
                addMessage('Error: Could not reach server.', false);
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        async function clearHistory() {
            chatBox.innerHTML = '';
            addMessage('Chat cleared. How can I help you?', false);
            await fetch('/chat/history', { method: 'DELETE' });
        }

        userInput.focus();
    </script>
</body>
</html>
